name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    # Explicit bash enables pipefail so curl/jq pipelines fail the step.
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install hash-locked Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: Install checksum-pinned Terraform for console tests
        run: |
          bash scripts/install-ci-terraform.sh "$RUNNER_TEMP/terraform/bin"
          printf '%s\n' "$RUNNER_TEMP/terraform/bin" >> "$GITHUB_PATH"
      - name: Install pinned security scanner (isolated tool cache)
        run: |
          mkdir -p "$RUNNER_TEMP/security-tools/home" "$RUNNER_TEMP/security-tools/bin"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/security-tools/home" \
            GOENV=off GOTOOLCHAIN=local GOTELEMETRY=off GOEXPERIMENT= \
            GOPATH="$RUNNER_TEMP/security-tools/gopath" \
            GOMODCACHE="$RUNNER_TEMP/security-tools/modules" \
            GOCACHE="$RUNNER_TEMP/security-tools/cache" \
            GOBIN="$RUNNER_TEMP/security-tools/bin" \
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: go vet
        run: go vet ./...
      - name: generated files up to date
        # Porcelain also catches new untracked generated files.
        run: go generate ./... && test -z "$(git status --porcelain)"
      - name: go test (envtest)
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use 1.35.0 --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          export KUBEBUILDER_ASSETS
          cli="$RUNNER_TEMP/demo-driver"
          go build -o "$cli" ./cmd/demo-driver
          export P2C_CLI="$cli" P2D_CLI="$cli" P2E_CLI="$cli" P2F_CLI="$cli"
          export P3B_CLI="$cli" WORKLOAD_SAFETY_CLI="$cli"
          python3 -B scripts/m3-ci-contract.py environment --go "$(command -v go)" --envtest-assets "$KUBEBUILDER_ASSETS" --terraform "$(command -v terraform)"
          OPSLOOP_REQUIRE_ENVTEST=1 go test -json -count=1 -timeout=45m ./... | tee "$RUNNER_TEMP/go-tests.jsonl"
          python3 -B scripts/m3-ci-contract.py go-log "$RUNNER_TEMP/go-tests.jsonl"
      - name: Terraform disk input contract (console only)
        run: python3 -B scripts/m3-python-tests.py --terraform-only
      - name: Demo A reset safety (mock only)
        run: |
          bash -n demos/node-failure/run.sh
          python3 -B -m unittest discover -s tests -p test_demo_reset.py -v
          python3 -B -m unittest discover -s tests -p test_dashboard_replay.py -v
      - name: Public Collector race regression (synthetic only)
        run: go test -race ./internal/publicstatus ./cmd/status-collector

      - name: Online security gate and Python regressions
        run: |
          python3 -B scripts/run-security.py \
            --go "$(command -v go)" \
            --scanner "$RUNNER_TEMP/security-tools/bin/govulncheck" \
            --gomodcache "$(go env GOMODCACHE)" --gocache "$(go env GOCACHE)" \
            --output "$RUNNER_TEMP/security-evidence"
      - name: Retain security diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-evidence
          path: |
            ${{ runner.temp }}/go-tests.jsonl
            ${{ runner.temp }}/security-evidence/**/*.json
            ${{ runner.temp }}/security-evidence/**/*.stdout
            ${{ runner.temp }}/security-evidence/**/*.stderr
          if-no-files-found: warn
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Pin by digest so a retag cannot change the privileged binfmt image.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pin by digest so a retag cannot change the builder.
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: controller multi-arch build (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg APP=cmd/opsloop-controller --build-arg "VERSION=$GITHUB_SHA" .
      - name: demo-api smoke (QEMU emulated)
        run: |
          echo "## demo-api smoke (QEMU emulated)" >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -t "smoke:$arch" .
            docker run -d --name "smoke-$arch" --platform "linux/$arch" -p 18080:8080 "smoke:$arch"
            if ! timeout 30 sh -c 'until curl -fsS localhost:18080/health >/dev/null; do sleep 1; done'; then
              docker logs "smoke-$arch"
              exit 1
            fi
            curl -fsS localhost:18080/ | jq -e --arg a "$arch" '.arch == $a'
            docker rm -f "smoke-$arch"
            echo "- linux/$arch: /health 200, arch=$arch (QEMU emulated)" >> "$GITHUB_STEP_SUMMARY"
          done

  dashboard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - name: install locked Dashboard dependencies
        working-directory: frontend/dashboard
        run: npm ci
      - name: Dashboard typecheck
        working-directory: frontend/dashboard
        run: npm run typecheck
      - name: Dashboard Vitest
        working-directory: frontend/dashboard
        run: npm test
      - name: Dashboard production build
        working-directory: frontend/dashboard
        run: npm run build
      - name: Public build boundary regression
        working-directory: frontend/dashboard
        run: npm run test:public-build
      - name: Public Dashboard production build
        working-directory: frontend/dashboard
        run: npm run build:public
      - name: Public artifact boundary and SHA256 manifest
        working-directory: frontend/dashboard
        run: |
          node scripts/audit-public.mjs
          echo 'PUBLIC_ASSET_MANIFEST_BEGIN'
          cat public-artifact-manifest.json
          echo 'PUBLIC_ASSET_MANIFEST_END'
      - name: install locked local Worker test tools
        working-directory: worker
        run: npm ci
      - name: Public Status types, boundary and production build
        working-directory: frontend/dashboard
        run: |
          npm run typecheck:status-worker
          npm run test:status-build
          npm run build:status
      - name: Local Worker and D1 integration (synthetic only)
        working-directory: worker
        run: |
          npm run build
          npm test
      - name: Install pinned Playwright Chromium for local browser tests
        working-directory: worker
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Public Status desktop/mobile and CSP regression
        working-directory: worker
        run: npm run test:browser
      - name: Pinned Go contract fixtures remain identical
        run: bash frontend/dashboard/contracts/verify.sh "$PWD" historical
      - name: Current merged Go backend agrees with committed fixtures
        run: bash frontend/dashboard/contracts/verify.sh "$PWD" current

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [verify, image, dashboard]
    environment: acr-publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: base images pinned by digest
        run: awk 'toupper($1)=="FROM" || tolower($0) ~ /^#[ \t]*syntax[ \t]*=/{n+=toupper($1)=="FROM"; if ($0 !~ /@sha256:[0-9a-f]{64}/) bad=1} END{exit bad || !n}' Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pin by digest so a retag cannot change the builder.
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: acr login
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"
      - name: publish demo-api
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE: demo-api
          APP: apps/demo-api
        run: |
          REF="$ACR_NAME.azurecr.io/opsloop/$IMAGE:sha-$GITHUB_SHA"
          # Only a "not found" failure means the tag is free; any other error (auth etc.) must not lead to a push.
          if out=$(docker buildx imagetools inspect "$REF" 2>&1); then
            echo "tag exists: $REF"; exit 1
          elif ! grep -qi 'not found' <<<"$out"; then
            echo "$out"; exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "APP=$APP" --build-arg "VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=mode=min --push -t "$REF" .
          docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' > idx.json
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' idx.json
          {
            echo "## $IMAGE"
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`$REF\` |"
            echo "| index digest | \`$(jq -r .digest idx.json)\` |"
            jq -r '.manifests[] | select(.platform.os != "unknown") | "| \(.platform.os)/\(.platform.architecture) digest | `\(.digest)` |"' idx.json
            echo "| source SHA | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$REF" --format '{{json .Image}}' \
            | jq -e --arg s "$GITHUB_SHA" '[."linux/amd64", ."linux/arm64"] | all(.config.Labels["org.opencontainers.image.revision"] == $s)'
      - name: publish controller
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE: controller
          APP: cmd/opsloop-controller
        run: |
          REF="$ACR_NAME.azurecr.io/opsloop/$IMAGE:sha-$GITHUB_SHA"
          # Only a "not found" failure means the tag is free; any other error (auth etc.) must not lead to a push.
          if out=$(docker buildx imagetools inspect "$REF" 2>&1); then
            echo "tag exists: $REF"; exit 1
          elif ! grep -qi 'not found' <<<"$out"; then
            echo "$out"; exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "APP=$APP" --build-arg "VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=mode=min --push -t "$REF" .
          docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' > idx.json
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' idx.json
          {
            echo "## $IMAGE"
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ref | \`$REF\` |"
            echo "| index digest | \`$(jq -r .digest idx.json)\` |"
            jq -r '.manifests[] | select(.platform.os != "unknown") | "| \(.platform.os)/\(.platform.architecture) digest | `\(.digest)` |"' idx.json
            echo "| source SHA | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$REF" --format '{{json .Image}}' \
            | jq -e --arg s "$GITHUB_SHA" '[."linux/amd64", ."linux/arm64"] | all(.config.Labels["org.opencontainers.image.revision"] == $s)'
