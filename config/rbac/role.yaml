---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opsloop-controller
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - opsloop.io
  resources:
  - recoveryincidents
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - opsloop.io
  resources:
  - recoveryincidents/status
  - recoverypolicies/status
  verbs:
  - get
  - update
- apiGroups:
  - opsloop.io
  resources:
  - recoverypolicies
  verbs:
  - get
  - list
  - watch
