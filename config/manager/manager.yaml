apiVersion: v1
kind: Namespace
metadata:
  name: opsloop-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsloop-controller
  namespace: opsloop-system
  labels:
    app.kubernetes.io/name: opsloop-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsloop-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsloop-controller
    spec:
      serviceAccountName: opsloop-controller
      # The controller stays on the Laptop control-plane VM (arch §3:59).
      nodeSelector:
        kubernetes.io/hostname: opsloop-control
      # Secret value lives outside Git.
      imagePullSecrets:
        - name: acr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Placeholder; the owner overlay pins the real registry name and digest.
          image: opsloop-controller
          args:
            # Service name not yet verified against the cluster (U14).
            - --prometheus-url=http://opsloop-mon-kube-prometheu-prometheus.monitoring.svc:9090
            - --leader-elect=true
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
